name: matchmind
services:
  db:
    image: timescale/timescaledb-ha:pg17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: matchmind
      POSTGRES_PASSWORD: matchmind
      POSTGRES_DB: matchmind
    volumes:
      - db_data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchmind -d matchmind"]
      interval: 5s
      timeout: 5s
      retries: 20
    shm_size: 2gb
volumes:
  db_data:
