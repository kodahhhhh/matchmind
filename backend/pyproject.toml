[project]
name = "matchmind"
version = "0.1.0"
description = "MatchMind football analytics backend"
requires-python = ">=3.12,<3.13"
dependencies = ["psycopg[binary]>=3.2,<4", "pydantic-settings>=2.7,<3"]

[dependency-groups]
models = ["socceraction==1.5.3", "lightgbm>=4.6,<5", "scikit-learn>=1.6,<2", "pandas>=2.2,<3", "pyarrow>=19", "multimethod<2", "joblib>=1.4"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["matchmind"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
