[project]
name = "matchpulse"
version = "0.1.0"
description = "MatchPulse football analytics backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "numpy>=1.26",
    "openai>=3.24.0",
    "pandas>=2.2,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "ruptures>=1.1.10",
    "uvicorn>=0.54.0",
]

[dependency-groups]
models = ["socceraction==1.5.3", "lightgbm>=4.6,<5", "scikit-learn>=1.6,<2", "pandas>=2.2,<3", "pyarrow>=19", "multimethod<2", "joblib>=1.4"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["matchpulse"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
